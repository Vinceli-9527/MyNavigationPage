# 局域网反向代理: your-nas.local（示例域名，替换为你自己的） -> holy-web (127.0.0.1:8080)
# 部署位置: /usr/trim/nginx/conf/conf.d/vincenavigation.conf (fnOS 自带 nginx)
# 由 deploy/dnsmasq 提供 DNS 解析, 由本文件提供 80 端口域名入口

server {
    listen 80;
    server_name VinceNavigation.local;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}