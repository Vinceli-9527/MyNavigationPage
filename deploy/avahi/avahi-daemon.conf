[server]
host-name=home
domain-name=local
browse-domains=
use-ipv4=yes
use-ipv6=no
allow-interfaces=
deny-interfaces=
check-response-ttl=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no

[wide-area]
enable-wide-area=no

[reflector]
reflect-ipv=no

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=30
rlimit-stack=4194304
rlimit-nproc=3
