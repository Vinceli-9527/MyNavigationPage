# holy-dns — 局域网 DNS 服务（dnsmasq）
# ⚠️ 模板说明:
#   - 下面的 192.168.1.100 / 192.168.1.1 均为示例 IP（作者环境的占位），
#     请替换为你自己环境中 NAS / 路由器的实际局域网 IP。
#   - 域名 your-nas.local 为示例，可改成你喜欢的名字（需与 Caddyfile 一致）。
#   - 部署时请把本文件放在项目 deploy/dnsmasq/ 下，勿把真实 IP 提交到公开仓库。

port=53
bind-interfaces
listen-address=127.0.0.1,192.168.1.100

# 不读系统 resolv.conf，固定上游 DNS
no-resolv
no-poll
no-hosts
server=223.5.5.5
server=119.29.29.29

# 本地域名: 只应答本域，绝不外发查询
local=/your-nas.local/
address=/your-nas.local/192.168.1.100

domain-needed
bogus-priv
cache-size=1000
